[extend]
useDefault = true

# Synthetic authenticator secrets of the browser tests, 16 characters of base32.
[[allowlists]]
condition = "AND"
paths = ['''^database/seeders/E2eSeeder\.php$''', '''^tests/e2e/support\.ts$''']
regexTarget = "secret"
regexes = ['''^[A-Z2-7]{16}$''']
