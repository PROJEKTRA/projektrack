#
# Signed release pipeline (S-0924, security baseline section 9). A tag vX.Y.Z
# on a commit of main whose CI passed on push builds:
#   - projektrack-X.Y.Z.zip with vendor/ and compiled assets, and its CycloneDX SBOM;
#   - the image, pushed by digest only, scanned (fails on fixable critical),
#     with provenance and a CycloneDX SBOM.
# Nothing is signed or tagged before a reviewer approves the "release"
# environment. The approved job signs SHA256SUMS with the Ed25519 release key
# (secret RELEASE_SIGNING_KEY) and by cosign, and signs and attests the image;
# no third-party package code runs in it. A separate job without write rights
# verifies the result with the release keys of this and of the previous
# release; only then is the image tagged and the release published.
# Actions are pinned to full commit SHAs.

name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  IMAGE: ghcr.io/projektra/projektrack

jobs:
  gate:
    name: Version and green CI on main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          version="${TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::The tag $TAG is not a version."; exit 1
          fi
          # The commit is part of main (not only of a pull request branch named main) ...
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$SHA...main" --jq .status)
          if [[ "$status" != "ahead" && "$status" != "identical" ]]; then
            echo "::error::$SHA is not on main."; exit 1
          fi
          # ... and its CI passed on a push to main.
          green=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --commit "$SHA" \
                    --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
          if [[ "$green" -lt 1 ]]; then
            echo "::error::CI on main is not green for $SHA."; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  zip:
    name: Release ZIP and SBOM
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: intl, bcmath, sodium, gd, fileinfo, zip
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build the ZIP
        run: |
          deploy/release/build-zip.sh "$VERSION" dist
          mkdir -p "$RUNNER_TEMP/unpacked"
          unzip -q "dist/projektrack-$VERSION.zip" -d "$RUNNER_TEMP/unpacked"

      # The SBOM describes what ships: the unpacked ZIP, incl. vendor/composer/installed.json.
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ${{ runner.temp }}/unpacked
          format: cyclonedx-json
          output-file: dist/projektrack-${{ env.VERSION }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-zip
          path: dist/
          retention-days: 7

  image:
    name: Image by digest, scan and SBOM
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # By digest only: no tag and no signature until the release is approved.
      - name: Push by digest with provenance
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          build-args: PROJEKTRACK_VERSION=${{ env.VERSION }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max

      # Security baseline 9: the pushed digest itself, failing on fixable critical findings.
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-format: table

      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: dist/projektrack-${{ env.VERSION }}.image.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Record the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: printf '%s@%s\n' "$IMAGE" "$DIGEST" > "dist/projektrack-$VERSION.image.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image
          path: dist/
          retention-days: 7

  sign:
    name: Sign (approved)
    needs: [gate, zip, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Both SBOMs are present
        run: |
          for sbom in "dist/projektrack-$VERSION.cdx.json" "dist/projektrack-$VERSION.image.cdx.json"; do
            if [[ ! -s "$sbom" ]]; then echo "::error::Missing SBOM $sbom"; exit 1; fi
          done

      - name: Checksums and Ed25519 signature
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [[ -z "$RELEASE_SIGNING_KEY" ]]; then
            echo "::error::The secret RELEASE_SIGNING_KEY of the release environment is not set."; exit 1
          fi
          key="$RUNNER_TEMP/release-signing.pem"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key")
          deploy/release/sign.sh dist "$key"

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Cosign signatures
        run: |
          ref="$(cat "dist/projektrack-$VERSION.image.txt")"
          cosign sign-blob --yes --bundle dist/SHA256SUMS.cosign.bundle dist/SHA256SUMS
          cosign sign --yes "$ref"
          cosign attest --yes --type cyclonedx --predicate "dist/projektrack-$VERSION.image.cdx.json" "$ref"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed
          path: dist/
          retention-days: 7

  verify:
    name: Verify as an instance would
    needs: [gate, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed
          path: dist

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: intl, bcmath, sodium, gd, fileinfo, zip
          tools: composer:v2
          coverage: none

      - name: Keys of this release and of the previous one
        run: |
          composer install --no-dev --no-scripts --no-interaction --no-progress --prefer-dist
          cp .env.example .env
          php artisan key:generate --no-interaction
          php artisan projektrack:release:verify "dist/projektrack-$VERSION.zip" --release="$VERSION"
          # An update is checked with the keys of the running release, so the
          # previous release must already trust the key that signed this one.
          # Tags whose key file is empty were never published (they could not
          # pass this job), so the newest tag that ships a key counts.
          for tag in $(git tag --list 'v[0-9]*' --sort=-v:refname --merged "$GITHUB_SHA^" 2>/dev/null); do
            keys="$(git show "$tag:resources/release/public-keys.txt" 2>/dev/null | grep -v -e '^#' -e '^[[:space:]]*$' || true)"
            [[ -n "$keys" ]] || continue
            echo "Previous release with keys: $tag"
            cp -r . "$RUNNER_TEMP/previous-keys"
            printf '%s\n' "$keys" > "$RUNNER_TEMP/previous-keys/resources/release/public-keys.txt"
            (cd "$RUNNER_TEMP/previous-keys" && php artisan projektrack:release:verify "$GITHUB_WORKSPACE/dist/projektrack-$VERSION.zip" --release="$VERSION")
            break
          done

  publish:
    name: Tag the image and publish
    needs: [gate, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed
          path: dist

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Tag the signed image
        run: |
          ref="$(cat "dist/projektrack-$VERSION.image.txt")"
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "$ref"
          tagged="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')"
          if [[ "$IMAGE@$tagged" != "$ref" ]]; then
            echo "::error::The tag points to $tagged, not to the signed $ref."; exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Projektrack $VERSION" \
            --notes "Verify before installing or updating: see docs/admin/releases.md." \
            dist/*
