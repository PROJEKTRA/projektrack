#
# Signed release pipeline (S-0924, security baseline section 9). A tag vX.Y.Z
# on a commit of main whose CI is green builds:
#   - projektrack-X.Y.Z.zip with vendor/ and compiled assets, and its CycloneDX SBOM;
#   - the image ghcr.io/projektra/projektrack:X.Y.Z, scanned (fails on fixable
#     critical), with provenance, a CycloneDX SBOM attestation and a cosign signature;
#   - SHA256SUMS over all files, signed with the Ed25519 release key
#     (SHA256SUMS.sig, checked by projektrack:release:verify) and by cosign.
# Signing runs in the "release" environment (approval and the secret
# RELEASE_SIGNING_KEY). Actions are pinned to full commit SHAs.

name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  IMAGE: ghcr.io/projektra/projektrack

jobs:
  gate:
    name: Version and green CI
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          version="${TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::The tag $TAG is not a version."; exit 1
          fi
          # Builds come only from commits that passed CI on main.
          green=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --commit "$SHA" \
                    --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
          if [[ "$green" -lt 1 ]]; then
            echo "::error::CI is not green on main for $SHA."; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  zip:
    name: Release ZIP and SBOM
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: intl, bcmath, sodium, gd, fileinfo, zip
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build the ZIP
        run: deploy/release/build-zip.sh "$VERSION" dist

      # Composer and npm packages from the lock files.
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/projektrack-${{ env.VERSION }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-zip
          path: dist/
          retention-days: 7

  image:
    name: Image, scan, SBOM and signature
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for the scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          build-args: PROJEKTRACK_VERSION=${{ env.VERSION }}
          tags: projektrack:scan
          load: true
          push: false

      # Security baseline 9: fails on fixable critical vulnerabilities.
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: projektrack:scan
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-format: table

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push with provenance
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          build-args: PROJEKTRACK_VERSION=${{ env.VERSION }}
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          push: true
          provenance: mode=max

      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: dist/projektrack-${{ env.VERSION }}.image.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the image and attest its SBOM
        env:
          REF: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type cyclonedx --predicate "dist/projektrack-$VERSION.image.cdx.json" "$REF"
          printf '%s\n' "$REF" > "dist/projektrack-$VERSION.image.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image
          path: dist/
          retention-days: 7

  publish:
    name: Sign and publish
    needs: [gate, zip, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Checksums and Ed25519 signature
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [[ -z "$RELEASE_SIGNING_KEY" ]]; then
            echo "::error::The secret RELEASE_SIGNING_KEY of the release environment is not set."; exit 1
          fi
          key="$RUNNER_TEMP/release-signing.pem"
          (umask 077 && printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key")
          deploy/release/sign.sh dist "$key"
          rm -f "$key"

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Cosign signature of the checksum list
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.cosign.bundle dist/SHA256SUMS

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: intl, bcmath, sodium, gd, fileinfo
          tools: composer:v2
          coverage: none

      # The same check an instance runs, with the keys this commit ships.
      - name: Verify with the shipped release keys
        run: |
          composer install --no-dev --no-interaction --no-progress --prefer-dist
          cp .env.example .env
          php artisan key:generate --no-interaction
          php artisan projektrack:release:verify "dist/projektrack-$VERSION.zip"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Projektrack $VERSION" \
            --notes "Verify before installing: php artisan projektrack:release:verify projektrack-$VERSION.zip (see docs/admin/releases.md)." \
            dist/*
