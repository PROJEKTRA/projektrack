#
# Quality and security pipeline (S-0908). Every pull request and every push to
# main runs static checks once and the test suite on each supported database
# and PHP version. Third-party actions are pinned to full commit SHAs.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # On main every commit keeps its run: a release needs green CI on its commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24'

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci

      - name: Dependency audit
        run: |
          composer audit --no-dev
          npm audit --omit=dev --audit-level=high

      - name: PHP style (Pint)
        run: vendor/bin/pint --test

      - name: PHP static analysis (PHPStan max)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Frontend lint, format and types
        run: |
          cp .env.example .env
          php artisan key:generate
          npm run build
          npm run lint
          npm run format:check
          npm run typecheck

      - name: OpenAPI document current (S-0913)
        run: php artisan projektrack:api:openapi --check

      - name: Frontend unit tests (Vitest)
        run: npm test

      - name: Forbidden content
        run: |
          # Docs, UI copy and templates use no en dash (project rule).
          if grep -rn $'–' --include='*.md' --include='*.vue' --include='*.ts' --include='*.php' --include='*.json' . \
               --exclude-dir=vendor --exclude-dir=node_modules --exclude-dir=public; then
            echo "::error::En dash found"; exit 1
          fi
          # Every first-party source file carries the copyright header.
          missing=$(grep -rL 'PROJEKTRA IT SAVJETOVANJE' app ee bootstrap/app.php config database routes scripts tests resources/js resources/css resources/views \
                     --include='*.php' --include='*.ts' --include='*.vue' --include='*.css' \
                     | grep -v -E 'resources/js/(components/ui|actions|routes|wayfinder)/' || true)
          if [ -n "$missing" ]; then echo "::error::Missing copyright header:"; echo "$missing"; exit 1; fi

  tests:
    name: Tests (PHP ${{ matrix.php }}, ${{ matrix.db.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        db:
          - name: MySQL 8.4
            connection: mysql
            image: mysql:8.4
            port: 3306
            user: root
            health: >-
              --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psecret"
              --health-interval=5s --health-timeout=5s --health-retries=20
          - name: MariaDB 11.4
            connection: mariadb
            image: mariadb:11.4
            port: 3306
            user: root
            health: >-
              --health-cmd="healthcheck.sh --connect --innodb_initialized"
              --health-interval=5s --health-timeout=5s --health-retries=20
          - name: PostgreSQL 16
            connection: pgsql
            image: postgres:16
            port: 5432
            user: projektrack
            health: >-
              --health-cmd="pg_isready -U projektrack"
              --health-interval=5s --health-timeout=5s --health-retries=20

    services:
      db:
        image: ${{ matrix.db.image }}
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: projektrack
          MYSQL_USER: projektrack
          MYSQL_PASSWORD: secret
          MARIADB_ROOT_PASSWORD: secret
          MARIADB_DATABASE: projektrack
          MARIADB_USER: projektrack
          MARIADB_PASSWORD: secret
          POSTGRES_DB: projektrack
          POSTGRES_USER: projektrack
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
          - 3306:3306
        options: ${{ matrix.db.health }}

    env:
      DB_CONNECTION: ${{ matrix.db.connection }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.db.port }}
      DB_DATABASE: projektrack
      # Parallel tests create one database per process, which needs an admin account.
      DB_USERNAME: ${{ matrix.db.user }}
      DB_PASSWORD: secret

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, pdo_pgsql, intl, bcmath, sodium, gd, fileinfo
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install and build
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci
          cp .env.example .env
          php artisan key:generate
          npm run build

      - name: Pest on ${{ matrix.db.name }}
        run: vendor/bin/pest --parallel

  plain-hosting:
    name: Tests (plain hosting profile, SQLite, no Redis)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DB_CONNECTION: sqlite
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, intl, bcmath, sodium, gd, fileinfo, :redis
          tools: composer:v2
          coverage: pcov

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install and build
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci
          cp .env.example .env
          php artisan key:generate
          npm run build

      - name: Pest on SQLite, coverage of app and modules
        run: vendor/bin/pest --parallel --coverage --min=85

  e2e:
    name: Browser tests (Playwright, bs and ar)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, intl, bcmath, sodium, gd, fileinfo
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install and build
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci
          cp .env.example .env
          php artisan key:generate
          npm run build
          npx playwright install --with-deps chromium

      # Screenshots are compared with the baselines in tests/e2e/__screenshots__.
      # A screen without a baseline gets one written (see the step below).
      - name: Playwright
        run: npx playwright test --update-snapshots=missing

      - name: New screenshot baselines
        id: baselines
        run: |
          new=$(git status --porcelain --untracked-files=all tests/e2e/__screenshots__)
          if [ -n "$new" ]; then
            echo "::warning::New screenshot baselines were written. Review the artifact 'screenshot-baselines' and commit the files to tests/e2e/__screenshots__."
            echo "$new"
            echo "written=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.baselines.outputs.written == 'true'
        with:
          name: screenshot-baselines
          path: tests/e2e/__screenshots__/
          retention-days: 14

      # JUnit report of every run, incl. the crawl (S-0988), kept 30 days.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-report
          path: test-results/junit.xml
          retention-days: 30

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  # S-0924: the release ZIP as the release workflow builds it, signed with a
  # throwaway key; verification must accept it and refuse any change.
  release-dry-run:
    name: Release ZIP and signature (dry run)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: intl, bcmath, sodium, gd, fileinfo, zip
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Build, sign, verify, tamper
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          cp .env.example .env
          php artisan key:generate
          bash tests/release/dry-run.sh
          bash tests/release/approve.sh

  # S-0925: the ZIP on Apache, PHP and MariaDB only. The ZIP is kept for trying it out.
  plain-hosting-install:
    name: Plain hosting (ZIP on Apache, cron, no other tools)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: intl, bcmath, sodium, gd, fileinfo, zip
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Build, install, check
        run: bash tests/amp/install.sh dist

      # Never a build of a fork.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          name: test-zip
          path: dist/*.zip
          retention-days: 14

  # S-0923: the production stack as an operator starts it, incl. the restore drill.
  docker:
    name: Docker Compose stack (secrets, headers, rights, backup and restore)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build, start, check, back up and restore
        run: bash tests/docker/stack.sh

  # S-0927: update, refused updates, and forced failures that must roll back.
  docker-update:
    name: Docker Compose update and rollback
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Update, refuse, fail and roll back
        run: bash tests/docker/update.sh

  # Performance budget: 100,000 time entries on MariaDB.
  performance:
    name: Performance (100,000 entries, MariaDB)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      db:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: secret
          MARIADB_DATABASE: projektrack
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: projektrack
      DB_USERNAME: root
      DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, intl, bcmath, sodium, gd, fileinfo, opcache
          ini-values: opcache.enable=1
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install and build
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci
          cp .env.example .env
          php artisan key:generate
          npm run build
          npx playwright install --with-deps chromium

      - name: Performance budget
        run: npx playwright test -c playwright.performance.config.ts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: performance
          path: test-results/performance.json
          retention-days: 30

  # Security baseline 9: code and the whole history.
  security-static:
    name: Security (static analysis, secrets)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Secrets in the history (Gitleaks 8.30.1)
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --verbose --no-banner

      - name: Static analysis (Semgrep 1.186.0)
        if: always()
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep@sha256:6e1b04340e60e910fbb4ddbf3c857ab0918f064417ad5ac530014ccb3cf8c8f1 \
            semgrep scan --error --metrics=off --disable-version-check \
            --config .semgrep --config p/php --config p/javascript --config p/typescript --config p/owasp-top-ten --config p/github-actions --config p/dockerfile

  # Security baseline 9: attacks on the running application.
  security-dynamic:
    name: Security (attack scan, anonymous and signed in)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, intl, bcmath, sodium, gd, fileinfo
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install and build
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci
          cp .env.example .env
          php artisan key:generate
          npm run build
          npx playwright install --with-deps chromium

      - name: ZAP 2.17.0
        run: npx playwright test -c playwright.dast.config.ts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: zap-reports
          path: test-results/zap-*/report.json
          retention-days: 30

  # S-0968, S-0969: synthetic e-invoices against the official validators.
  e-invoices:
    name: E-invoices (KoSIT, veraPDF)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: intl, bcmath, sodium, gd, fileinfo, zip
          tools: composer:v2
          coverage: none

      - name: Write the samples
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          cp .env.example .env
          php artisan key:generate
          EINVOICE_SAMPLES="$PWD/samples" vendor/bin/pest modules/Invoices/tests/EInvoiceSamplesTest.php
          test "$(ls samples/*.xml | wc -l)" -ge 45
          test "$(ls samples/*.pdf | wc -l)" -ge 15

      - name: XRechnung and EN 16931 (KoSIT validator 1.6.3, rules of 2026-08-31)
        run: |
          mkdir kosit && cd kosit
          curl -fsSL -o validator.jar https://github.com/itplr-kosit/validator/releases/download/v1.6.3/validator-1.6.3-standalone.jar
          curl -fsSL -o rules.zip https://github.com/itplr-kosit/validator-configuration-xrechnung/releases/download/v2026-08-31/xrechnung-3.0.2-validator-configuration-2026-08-31.zip
          sha256sum -c <<'SUMS'
          799e64befca97d4080e03608c80b85dd5a5ecc5f4ae4f35d1116ec2855b9a7c9  validator.jar
          2530cd107c414511c5d0462ec10f886910395abfca820db82e83d70bf01221a8  rules.zip
          SUMS
          unzip -q rules.zip -d rules
          mkdir reports
          status=0
          java -jar validator.jar -s rules/scenarios.xml -r rules -o reports ../samples/*.xml || status=$?
          if [ "${status}" != 0 ]; then
            grep -ohE '<rep:message [^>]*level="error"[^>]*>[^<]*' reports/*.xml | sort | uniq -c | sort -rn | head -60 || true
            exit 1
          fi
          test "$(ls reports/*-report.xml | wc -l)" -eq "$(ls ../samples/*.xml | wc -l)"

      - name: PDF/A-3 (veraPDF 1.30.4)
        run: |
          cd samples
          docker run --rm -v "$PWD:/data:ro" -w /data verapdf/cli@sha256:c2ac9448973a56acd833c81441e38d2dca58ea26a2ce1621e9a32e85d3d2728f --flavour 3b --format text --verbose *.pdf
