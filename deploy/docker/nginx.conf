# Nginx inside the application container (S-0923), non-root on port 8080,
# behind the Caddy proxy. Mandatory headers as in infrastructure profiles 8.2.
# The application sets them on its own responses; Nginx adds each one only
# where it is missing (static files, errors of Nginx itself), so the values of
# the application, for example its nonce-based CSP, are never replaced.

worker_processes auto;
pid /tmp/nginx.pid;
# Only critical errors: lower levels quote the request line, which can carry tokens.
error_log /dev/stderr crit;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 40m;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # No request paths in the log: they can carry one-time tokens
    # (password reset, shared links, signed URLs).
    log_format projektrack '$remote_addr [$time_iso8601] $request_method $status $body_bytes_sent $request_time';
    access_log /dev/stdout projektrack;

    # A header with an empty value is not sent: each map yields the default
    # only when the application did not set the header itself.
    map $upstream_http_x_robots_tag $pt_robots { "" "noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate"; default ""; }
    map $upstream_http_referrer_policy $pt_referrer { "" "no-referrer"; default ""; }
    map $upstream_http_strict_transport_security $pt_hsts { "" "max-age=31536000"; default ""; }
    map $upstream_http_x_content_type_options $pt_nosniff { "" "nosniff"; default ""; }
    map $upstream_http_x_frame_options $pt_frame { "" "DENY"; default ""; }
    map $upstream_http_permissions_policy $pt_permissions { "" "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"; default ""; }
    map $upstream_http_cross_origin_opener_policy $pt_coop { "" "same-origin"; default ""; }
    map $upstream_http_cross_origin_resource_policy $pt_corp { "" "same-origin"; default ""; }
    map $upstream_http_content_security_policy $pt_csp { "" "default-src 'none'; img-src 'self'; style-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"; default ""; }

    server {
        listen 8080 default_server;
        root /app/public;
        index index.php;
        absolute_redirect off;

        # Inherited by every location below; none of them sets its own headers.
        add_header X-Robots-Tag $pt_robots always;
        add_header Referrer-Policy $pt_referrer always;
        add_header Strict-Transport-Security $pt_hsts always;
        add_header X-Content-Type-Options $pt_nosniff always;
        add_header X-Frame-Options $pt_frame always;
        add_header Permissions-Policy $pt_permissions always;
        add_header Cross-Origin-Opener-Policy $pt_coop always;
        add_header Cross-Origin-Resource-Policy $pt_corp always;
        add_header Content-Security-Policy $pt_csp always;

        # Errors of Nginx itself carry an empty body: its default pages name it.
        error_page 404 @empty404;
        error_page 413 @empty413;
        error_page 502 @empty502;
        error_page 504 @empty504;
        location @empty404 { return 404 ""; }
        location @empty413 { return 413 ""; }
        location @empty502 { return 502 ""; }
        location @empty504 { return 504 ""; }

        # Dotfiles and any PHP file but the front controller do not exist.
        location ~ /\. {
            return 404 "";
        }

        # The asset manifest is read from disk by the application, never over HTTP.
        location = /build/manifest.json {
            return 404 "";
        }

        location / {
            try_files $uri /index.php$is_args$args;
        }

        location = /index.php {
            internal;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param HTTP_PROXY "";
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_read_timeout 120s;
            fastcgi_hide_header X-Powered-By;
        }

        location ~ \.php$ {
            return 404 "";
        }
    }
}
