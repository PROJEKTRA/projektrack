;
; Loaded after the image's own pool files, so these values win.

[global]
error_log = /proc/self/fd/2
log_limit = 8192

[www]
; Only Nginx in the same container talks to PHP-FPM.
listen = 127.0.0.1:9000

; No access log: request paths can carry one-time tokens (reset and shared links).
access.log = /dev/null

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 1000

catch_workers_output = yes
decorate_workers_output = no
clear_env = no
